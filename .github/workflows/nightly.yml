name: Nightly test clocks

# Stripe drift -- a moved field, a changed status transition -- arrives on its
# own schedule rather than with your commits, so the sandbox suite runs against
# main every night as well as on pull requests (integration.yml). Both call the
# one definition in stripe-sandbox.yml.
on:
  schedule:
    # 07:00 UTC — midnight Pacific, so a failure is waiting in the morning.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cancelled in flight: killing a run mid-simulation
# skips the fixture teardown and orphans a test clock.
concurrency:
  group: nightly-test-clocks
  cancel-in-progress: false

jobs:
  lifecycle:
    uses: ./.github/workflows/stripe-sandbox.yml
    with:
      # On main a missing key is always a misconfiguration.
      missing-key: fail
    secrets: inherit
