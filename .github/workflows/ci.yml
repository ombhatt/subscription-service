name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    name: service (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml and what runs locally;
        # 3.12 catches drift before it becomes an upgrade problem.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts integration

      - name: Tests
        run: pytest -q

  migrations:
    name: migrations on postgres
    runs-on: ubuntu-latest

    # The test suite runs on SQLite for speed, so this is the only place the
    # schema meets the engine it will actually run on. Worth its own job:
    # a migration that works on SQLite and fails on Postgres is a deploy outage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscriptions
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Upgrade, roll back, upgrade again
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/subscriptions
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: web
    runs-on: ubuntu-latest
    # A hung browser test should fail in minutes, not burn GitHub's 6-hour
    # default. The suite takes about a minute.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    # Job-level, not on the Playwright webServer: NEXT_PUBLIC_* are inlined into
    # the client bundle at BUILD time, so they must be set for `next build`.
    # Supplying them only at server start bakes `undefined` into the bundle and
    # every page throws. Locally web/.env.local hides this; CI has no such file.
    # The values are irrelevant -- the suite intercepts every Supabase request.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # `next build` type-checks as part of building; the explicit typecheck
      # afterwards covers e2e/, which the build does not compile.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
