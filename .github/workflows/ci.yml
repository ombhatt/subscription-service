name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    name: service (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml and what runs locally;
        # 3.12 catches drift before it becomes an upgrade problem.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts integration

      # Coverage lives in its own `coverage` job so it can be required by
      # branch protection on its own name. This job answers "do the tests
      # pass", which is a different question from "is enough of it tested".
      - name: Tests
        run: pytest -q

  migrations:
    name: migrations on postgres
    runs-on: ubuntu-latest

    # The test suite runs on SQLite for speed, so this is the only place the
    # schema meets the engine it will actually run on. Worth its own job:
    # a migration that works on SQLite and fails on Postgres is a deploy outage.
    # Pinned to the major version Supabase actually runs (17), not whatever
    # was current when this was written.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscriptions
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: pip install -r requirements.lock

      - name: Upgrade, roll back, upgrade again
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/subscriptions
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: web
    runs-on: ubuntu-latest
    # A hung browser test should fail in minutes, not burn GitHub's 6-hour
    # default. The suite takes about a minute.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    # Job-level, not on the Playwright webServer: NEXT_PUBLIC_* are inlined into
    # the client bundle at BUILD time, so they must be set for `next build`.
    # Supplying them only at server start bakes `undefined` into the bundle and
    # every page throws. Locally web/.env.local hides this; CI has no such file.
    # The values are irrelevant -- the suite intercepts every Supabase request.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Before the build and the browsers: these are pure functions, they run
      # in under a second, and there is no reason to wait five minutes to find
      # out that a price is rounded the wrong way.
      # Before the build and the browsers: these are pure functions, they run
      # in under a second, and there is no reason to wait five minutes to find
      # out that a price is rounded the wrong way. The coverage *gate* on the
      # same tests lives in the `coverage` job.
      - name: Unit tests
        run: npm run test:unit

      # `next build` type-checks as part of building; the explicit typecheck
      # afterwards covers e2e/, which the build does not compile.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  images:
    name: images
    runs-on: ubuntu-latest
    # Building both images plus a live smoke test. Fifteen was tight once.
    timeout-minutes: 20

    # Real dependencies, because "the image builds" is a much weaker claim than
    # "the image starts, migrates a database and answers its own probes".
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subscriptions
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: subscription-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It runs as a non-root user
        run: |
          uid=$(docker run --rm subscription-api:ci id -u)
          test "$uid" = "10001" || { echo "image runs as uid $uid"; exit 1; }

      - name: The migration command works from inside the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/subscriptions \
            subscription-api:ci migrate

      - name: The API starts and answers both probes
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/subscriptions \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e ADMIN_API_KEY=ci-admin-key \
            subscription-api:ci

          # Liveness first: it depends on nothing, so it should come up fast.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done

          echo "--- /healthz ---"
          curl -fsS http://localhost:8000/healthz | tee /tmp/healthz
          echo
          echo "--- /readyz ---"
          # -f would hide the body on a 503, which is the part worth reading.
          code=$(curl -sS -o /tmp/readyz -w '%{http_code}' http://localhost:8000/readyz)
          cat /tmp/readyz; echo
          test "$code" = "200" || { echo "readyz returned $code with both deps up"; exit 1; }
          grep -q '"status": *"ok"' /tmp/readyz || { echo "expected status ok"; exit 1; }

      - name: Its logs are JSON
        run: |
          docker logs api 2>&1 | tail -20
          # Every line the container writes must parse, or an aggregator drops
          # the ones that do not and nobody notices until an incident.
          docker logs api 2>&1 | grep -v '^$' | while read -r line; do
            echo "$line" | python3 -c "import json,sys; json.loads(sys.stdin.read())" \
              || { echo "NOT JSON: $line"; exit 1; }
          done

      - name: Stop the API
        if: always()
        run: docker rm -f api || true

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          load: true
          tags: subscription-web:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://test-project.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
            API_ORIGIN=http://api-under-test:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API origin was baked in, not silently defaulted
        # Regression guard. API_ORIGIN looks like a runtime variable and is not:
        # rewrites() runs at build time and the destination is frozen into the
        # routes manifest. When this was passed as runtime `environment:`, the
        # frontend proxied to localhost and every API call returned 500 while
        # both containers reported healthy.
        run: |
          dest=$(docker run --rm --entrypoint sh subscription-web:ci \
            -c 'grep -o "http://[^\"]*" .next/routes-manifest.json | sort -u')
          echo "baked rewrite destination: $dest"
          case "$dest" in
            *api-under-test:8000*) echo "correct" ;;
            *) echo "API_ORIGIN was not applied at build time; got: $dest"; exit 1 ;;
          esac

      - name: The web image serves a page
        run: |
          docker run -d --name web -p 3000:3000 subscription-web:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://localhost:3000/
          docker rm -f web

      - name: docker-compose.yml is valid
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: docker compose --profile full config > /dev/null

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Its own job, and therefore its own check, so it can be marked required
    # in the branch ruleset. Folded into `service` it could only be required
    # together with the tests, and a coverage drop would show up in the PR's
    # check list looking like a test failure.
    #
    # Shape matters here. Measuring, reporting and gating are three separate
    # steps, and the gate is last. The first version of this job combined them
    # and died mid-step the moment coverage was low -- never writing the
    # summary it existed to write, and skipping the frontend entirely, so you
    # would fix the backend only to discover a frontend problem on the next
    # run. Both numbers now always reach the summary, and one final step
    # decides pass or fail.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # -- measure ---------------------------------------------------------

      - name: Measure backend coverage
        run: coverage run -m pytest -q

      - name: Measure frontend coverage
        id: web_coverage
        working-directory: web
        # The vitest thresholds fail this command. Recorded rather than acted
        # on, so the report below still runs.
        continue-on-error: true
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee /tmp/vitest.txt

      # -- report ----------------------------------------------------------

      - name: Report both numbers
        if: always()
        # Cannot fail. Every coverage invocation gets `|| true` because
        # `coverage report` enforces fail_under itself, in every form,
        # including --format=total -- which is what killed the first version
        # of this step before it wrote anything.
        run: |
          coverage report --skip-covered > /tmp/cov.txt 2>&1 || true
          total=$(coverage report --format=total 2>/dev/null | head -1 || true)
          {
            echo "## Coverage"
            echo
            echo "| | result | floor |"
            echo "|---|---|---|"
            echo "| backend | ${total:-n/a}% | 80% |"
            echo "| web/lib | ${{ steps.web_coverage.outcome }} | vitest thresholds |"
            echo
            echo "<details><summary>Backend detail</summary>"
            echo
            echo '```'
            cat /tmp/cov.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo '```'
            sed -n '/Coverage summary/,/^===============/p' /tmp/vitest.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -- gate ------------------------------------------------------------

      - name: Enforce the floors
        if: always()
        run: |
          failed=0

          # Exits 2 when below fail_under (80%, set in pyproject.toml).
          if ! coverage report > /dev/null 2>&1; then
            echo "::error::Backend coverage is below the 80% floor."
            coverage report | tail -3
            failed=1
          else
            echo "backend: at or above the floor"
          fi

          if [ "${{ steps.web_coverage.outcome }}" != "success" ]; then
            echo "::error::web/lib coverage is below its vitest thresholds."
            failed=1
          else
            echo "web/lib: at or above its thresholds"
          fi

          exit $failed
