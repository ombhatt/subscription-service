[project]
name = "subscription-service"
version = "0.1.0"
description = "Flat-price Free/Plus/Pro subscriptions on Stripe Billing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "stripe>=11.1",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only `tests` by default: `integration` needs a Stripe sandbox key and network,
# so it is opt-in via an explicit path (see integration/conftest.py).
testpaths = ["tests"]
# Put the repo root on sys.path so both suites can import `app` regardless of
# whether their directory happens to be a package.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a function call in an argument default.
# Without this, B008 fires on every route in the codebase.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# The interpreter guard is deliberately "unreachable" under target-version: its
# whole job is to fire on an older interpreter than the one we target.
"app/__init__.py" = ["UP036"]
