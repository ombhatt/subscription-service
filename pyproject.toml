[project]
name = "subscription-service"
version = "0.1.0"
description = "Flat-price Free/Plus/Pro subscriptions on Stripe Billing"
requires-python = ">=3.11"
# The libraries this service depends on directly, with the floor for each.
# This records *intent*; uv.lock records what actually gets installed,
# transitive dependencies and all, and is what every build reads. Change a
# floor here, then `make lock` and run the suite.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "stripe>=11.1",
    "python-dotenv>=1.0",
    # 2.14 and older: PYSEC-2026-4141 and PYSEC-2026-4183; 2.13 and older: token forgery.
    "pyjwt[crypto]>=2.15",
    "prometheus-client>=0.21",
    # Feature flags. Evaluation is local against an in-memory snapshot -- the
    # only network call is the background refresh -- so this does not sit in
    # the request path. Brings aiohttp and its tree with it.
    "growthbook>=3.1.1",
]

[dependency-groups]
# Test and lint tooling. Never in the image: `uv sync --no-dev` leaves it out.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "aiosqlite>=0.22",
    "coverage>=7.16",
    "ruff>=0.16",
]

[tool.uv]
# An application, not a library: install its dependencies, never build or
# install the project itself.
package = false
# The lockfile format follows the uv that wrote it. CI and the image pin the
# same version (see .github/workflows and the Dockerfile).
required-version = ">=0.13.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only `tests` by default: `integration` needs a Stripe sandbox key and network,
# so it is opt-in via an explicit path (see integration/conftest.py).
testpaths = ["tests"]
# Put the repo root on sys.path so both suites can import `app` regardless of
# whether their directory happens to be a package.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read the clock through `timeutil.utcnow()`, which the tests can freeze."
"datetime.datetime.utcnow".msg = "Read the clock through `timeutil.utcnow()`, which the tests can freeze."
"time.time".msg = "Read the clock through `timeutil.utcnow()`, which the tests can freeze."

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a function call in an argument default.
# Without this, B008 fires on every route in the codebase.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# The interpreter guard is deliberately "unreachable" under target-version: its
# whole job is to fire on an older interpreter than the one we target.
"app/__init__.py" = ["UP036"]
# The clock ban is for app code. The seam itself reads the real clock, and
# tests, scripts and the integration suite may too.
"app/timeutil.py" = ["TID251"]
"{tests,integration,scripts}/**" = ["TID251"]

[tool.coverage.run]
source = ["app"]
branch = true
# Without greenlet, coverage misses everything that runs inside SQLAlchemy's
# async bridge -- which is most of the request path. Measured without it, the
# whole webhook handler body reports as unreached while its tests pass, and
# you go hunting for a gap that is not there. This one line is the difference
# between a 70% report and a true 75%.
concurrency = ["thread", "greenlet"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# A floor rather than a target. Set a little below where the suite actually
# sits, so it catches a real regression without failing every PR that adds a
# branch. Raise it when the number moves up and stays up.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
